version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: cgc_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: colombo_gold_covering
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cgc_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cgc_backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/colombo_gold_covering?authSource=admin
      JWT_SECRET: cgc_prod_super_secret_jwt_key_2026_luxury_covering
      JWT_EXPIRE: 7d
      FRONTEND_URL: http://localhost
      CORS_ORIGIN: http://localhost,http://localhost:3000,https://colombogoldcovering.lk
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - cgc_network
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cgc_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost
    networks:
      - cgc_network
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: cgc_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cgc_network

volumes:
  mongo_data:
  backend_uploads:

networks:
  cgc_network:
    driver: bridge

